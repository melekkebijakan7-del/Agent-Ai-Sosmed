name: Run AI Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # <--- Ini pengaman utama agar proses 'git pull' dan 'git push' tidak pernah error merah lagi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run main script
        run: python main.py

      - name: Commit and Push generated news to docs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Menarik data terbaru dari GitHub agar sinkron dan tidak tabrakan
          git pull origin main --rebase || true
          
          # Menyimpan perubahan file HTML
          git add docs/
          git commit -m "Auto-update Berita Investigasi MELEK.KEBIJAKAN.ID [skip ci]" || echo "No changes to commit"
          
          # Mendorong perubahan ke website
          git push origin main
