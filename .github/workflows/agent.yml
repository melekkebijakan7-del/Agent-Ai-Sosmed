name: Run AI Agent

on:
  workflow_dispatch:

permissions:
  contents: write  # IZIN PENTING agar agen bisa otomatis commit & push file ke GitHub

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run main script
        run: python main.py

      - name: Commit and Push generated news to docs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Auto-update portal berita Melek Kebijakan [skip ci]" || echo "No changes to commit"
          git push
